name: Build Samsung Probe APK

on:
  push:
    branches:
      - "claude/**"
    paths:
      - "samsung-call-recording-probe/**"
      - ".github/workflows/probe-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samsung-call-recording-probe
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest 러너에는 Android SDK(platform 34 포함)가 이미 설치돼 있어
      # 별도 setup-android 액션이 필요 없다. (그 액션은 사라진 'tools' 패키지를
      # 설치하려다 실패함). 사전설치 SDK 경로만 노출한다.
      - name: Show preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Build debug APK
        run: |
          # 러너가 프로세스 env 로 넣어준 ANDROID_HOME 을 그대로 사용한다.
          # (step-level env 로 다시 지정하면 빈 값으로 덮일 수 있어 쓰지 않는다.)
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
          cat local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: probe-debug-apk
          path: samsung-call-recording-probe/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
