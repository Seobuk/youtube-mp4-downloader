name: Build Samsung Probe APK

on:
  push:
    branches:
      - "claude/**"
    paths:
      - "samsung-call-recording-probe/**"
      - ".github/workflows/probe-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samsung-call-recording-probe
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: probe-debug-apk
          path: samsung-call-recording-probe/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
